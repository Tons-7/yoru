<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Can't reach Yoru</title>
    <!-- Shown by the installed app's worker when a page can't load at all; kept whole, with nothing to fetch. -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #eef1f6;
        font: 15px/1.55 -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      main { max-width: 26rem; display: flex; flex-direction: column; gap: 14px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      p { margin: 0; color: #b3bbcc; }
      button {
        align-self: flex-start; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
        background: #6f5cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #b0a6ff; outline-offset: 2px; }
      #status { font-size: 13px; color: #8891a5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Yoru</h1>
      <p>The computer Yoru runs on may be asleep, Yoru may be closed, or this device is on another network.</p>
      <button id="retry" type="button">Try again</button>
      <p id="status" role="status">Trying again every few seconds.</p>
    </main>
    <script>
      // Any answer at all means Yoru is back, even a refusal: reloading then shows the page that was asked for.
      const status = document.getElementById('status')
      let busy = false
      async function check(byHand) {
        if (busy) return
        busy = true
        if (byHand) status.textContent = 'Trying…'
        try {
          await fetch('/manifest.webmanifest', { cache: 'no-store', signal: AbortSignal.timeout(4000) })
          location.reload()
        } catch {
          status.textContent = byHand ? 'Still not answering. Trying again every few seconds.' : status.textContent
        } finally {
          busy = false
        }
      }
      document.getElementById('retry').addEventListener('click', () => check(true))
      setInterval(() => check(false), 5000)
      window.addEventListener('online', () => check(false))
    </script>
  </body>
</html>
